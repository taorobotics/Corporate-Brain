<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>连接公司大脑</title>
    <link rel="stylesheet" href="./fonts.css" />
    <style>
      body {
        margin: 0;
        background: #f4f2ed;
        color: #30322c;
        font: 14px var(--font-ui);
        font-synthesis: none;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      main {
        background: #fff;
        border: 1px solid #e5e2dc;
        border-radius: 16px;
        padding: 32px;
        width: 380px;
        box-shadow: 0 6px 28px #33332208;
      }
      h1 {
        font-size: 25px;
        margin: 0 0 15px;
      }
      .company-mark {
        display: block;
        width: 58px;
        height: 58px;
        object-fit: contain;
        margin-bottom: 20px;
      }
      p {
        color: #85877c;
        line-height: 1.8;
        font-size: 13px;
      }
      .locked-copy {
        margin-top: -4px;
        padding: 12px 14px;
        border: 1px solid #ead8ce;
        border-radius: 10px;
        background: #fcf7f3;
        color: #795e50;
      }
      label {
        display: block;
        font-size: 13px;
        margin: 25px 0 10px;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 12px;
        border: 1px solid #dddcd5;
        border-radius: 7px;
        outline: none;
        font: inherit;
      }
      input:focus {
        border-color: #b76c4e;
      }
      button {
        margin-top: 22px;
        background: #b76c4e;
        border: 0;
        color: #fff;
        border-radius: 7px;
        padding: 12px;
        width: 100%;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
      }
      button.secondary {
        margin-top: 12px;
        background: transparent;
        color: #a35e43;
        border: 1px solid #ead8ce;
      }
      button.legal {
        background: transparent;
        color: #a35e43;
        margin-top: 8px;
        font-size: 12px;
      }
      .error {
        color: #a34a34;
        min-height: 20px;
      }
      small {
        display: block;
        color: #919487;
        font-size: 11px;
        line-height: 1.7;
        margin-top: 22px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="company-mark" src="./brand/logo.png" alt="公司大脑" width="512" height="512" />
      <h1>公司大脑未配置</h1>
      <section id="locked-setup">
        <p>这个客户端还没有配置公司工作空间入口。</p>
        <p class="locked-copy">
          请联系公司管理员获取已配置的安装包。安装后直接使用管理员分配的部门账号和密码登录，不需要注册，也不需要填写服务器地址。
        </p>
      </section>
      <form id="server-form" hidden>
        <p>管理员配置模式：填写公司服务根地址，员工端会直接进入账号登录。</p>
        <label for="server-url">公司服务器地址</label
        ><input
          id="server-url"
          type="url"
          placeholder="https://brain.example.com"
          required
        />
        <p class="error" role="alert"></p>
        <button id="connect-button" type="submit">保存公司入口</button>
      </form>
      <button type="button" id="show-admin" class="secondary" hidden>
        管理员配置公司入口
      </button>
      <button type="button" id="show-legal" class="legal">隐私与许可</button>
      <small
        >对话保存在此电脑，按公司入口和员工账号隔离。公司账号、部门和密码由管理员统一分配。</small
      >
    </main>
    <script src="server-setup.js"></script>
  </body>
</html>
