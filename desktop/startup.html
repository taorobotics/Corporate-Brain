<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'"
    />
    <title>公司大脑 · 启动</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="entry-scene.css" />
    <link rel="stylesheet" href="startup.css" />
    <script src="entry-scene.js" defer></script>
    <script src="startup.js" defer></script>
  </head>
  <body>
    <brain-entry-scene
      id="scene"
      phase="connecting"
      headline="正在打开公司大脑"
    ></brain-entry-scene>
    <header class="window-controls">
      <button id="minimize" aria-label="最小化">−</button
      ><button id="maximize" aria-label="最大化或还原">□</button
      ><button id="close" aria-label="关闭">×</button>
    </header>
    <button id="skip" class="native-skip">跳过动画 <span>SKIP ▸</span></button>
    <div id="actions" hidden>
      <button id="retry">重新连接 <span>RETRY ↗</span></button>
      <p id="error-code"></p>
    </div>
  </body>
</html>
