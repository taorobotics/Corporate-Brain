<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'"><title>公司大脑 · 完整入场动效预览</title>
<link rel="stylesheet" href="../../../desktop/entry-scene.css"><link rel="stylesheet" href="../../../src/entry.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#171a18;font-family:"Microsoft YaHei","PingFang SC",sans-serif}.entry-experience{position:absolute;bottom:64px}.demo-toolbar{position:absolute;bottom:0;left:0;right:0;height:64px;padding:12px 24px;display:flex;align-items:center;gap:18px;color:#dfdfd5;background:#171a18;font-size:11px}.demo-toolbar button{padding:8px 14px;background:transparent;border:1px solid #686c62;color:inherit;cursor:pointer}.demo-toolbar button[aria-pressed=true]{background:#ece9df;color:#171a18}.demo-toolbar input{flex:1;accent-color:#d68b5d}.demo-label{opacity:.7}.entry-form-stage[hidden]{display:none}.field{display:grid;gap:8px;font-size:11px}.field>span{color:var(--entry-ui-muted)}.auth-legal{border:0;background:transparent;padding:0;cursor:pointer}.auth-card .button{font-family:inherit;cursor:pointer}.preview-caption{position:absolute;top:17px;left:24px;color:#969b8f;font:10px "Consolas",monospace;z-index:40;letter-spacing:2px}.preview-frame-actions{position:absolute;right:0;top:0;height:40px;display:flex;color:#888;z-index:40}.preview-frame-actions span{width:46px;text-align:center;line-height:40px}.demo-workspace{position:absolute;inset:0 0 64px;background:#faf9f5;color:#24251f;display:flex}.demo-sidebar{width:220px;padding:35px 25px;background:#eeece5;border-right:1px solid #ddd9cc;line-height:3;font-size:14px}.demo-sidebar strong{font-size:20px;display:block;margin-bottom:40px}.demo-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}.demo-main h2{font-size:32px;font-weight:500}.demo-composer{width:72%;height:145px;border:1px solid #d8d4c8;border-radius:18px;padding:25px;color:#929187;background:#fff}.demo-main small{color:#999}.recording .demo-toolbar{display:none}.recording .entry-experience,.recording .demo-workspace{bottom:0}.recording .preview-caption{display:none}.demo-workspace[data-theme=dark]{background:#181a17;color:#f4f0e5}.demo-workspace[data-theme=dark] .demo-sidebar{background:#20231f;border-color:#373a32}.demo-workspace[data-theme=dark] .demo-composer{background:#252823;border-color:#484a42;color:#b8b8ad}
</style><script src="../../../desktop/entry-scene.js" defer></script><script src="preview.js" defer></script></head><body>
<div class="demo-workspace" id="workspace"><aside class="demo-sidebar"><strong>◇ 公司大脑</strong>＋ 新建任务<br>项目<br>公司知识<br>技能中心<br>我的作品</aside><main class="demo-main"><h2>今天，一起完成些什么？</h2><div class="demo-composer">描述你的任务，或选择一个工作区开始…</div><small>此为动效预览中的示例工作区</small></main></div>
<section class="entry-experience" id="experience" data-theme="light" data-phase="connecting"><brain-entry-scene id="scene" phase="connecting" theme="light"></brain-entry-scene>
<span class="preview-caption">MOTION PREVIEW / CORPORATE BRAIN</span><div class="preview-frame-actions" aria-hidden="true"><span>−</span><span>□</span><span>×</span></div>
<button class="entry-skip" id="skip">跳过动画 <span>SKIP ▸</span></button>
<div class="entry-form-stage" id="form-stage" hidden><main class="auth"><div class="auth-card"><div class="eyebrow">WORKSPACE ACCESS / 公司工作空间</div><h1>登录公司账号</h1><p>使用管理员分配的账号和密码登录，继续你的工作。</p><form id="demo-form"><label class="field"><span>登录账号</span><input value="your.name" aria-label="示例账号" readonly></label><label class="field"><span>密码</span><input value="preview-only" type="password" aria-label="示例密码" readonly></label><button class="button primary" id="login" type="submit"><span>登录</span><span>↗</span></button></form></div><p class="auth-foot">动效预览 · 示例账号，不会连接服务器 <button class="auth-legal" type="button">隐私与许可</button></p></main></div>
</section>
<nav class="demo-toolbar" aria-label="预览控制"><button id="play">暂停</button><button id="restart">重播</button><span class="demo-label" id="phase-label">01 标识序幕</span><input id="scrub" type="range" min="0" max="14000" step="100" value="0" aria-label="播放进度"><span id="time">0.0 / 14.0s</span><button id="light" aria-pressed="true">暖色</button><button id="dark" aria-pressed="false">深色</button></nav>
</body></html>
