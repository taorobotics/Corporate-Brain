:root{--bg:#faf9f5;--side:#f3f0e9;--panel:#fff;--ink:#25251f;--muted:#8b8a82;--line:#e6e2d9;color-scheme:light}

*{box-sizing:border-box}body{margin:0;font:14px "Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer;color:inherit}header{height:64px;border-bottom:1px solid var(--line);padding:0 36px;display:flex;align-items:center;gap:18px}header strong{font-size:17px}header span{color:var(--muted);font-size:12px}.stage{max-width:920px;margin:0 auto;padding:60px 35px 24px;height:calc(100vh - 150px);display:flex;flex-direction:column}.transcript{flex:1}.message{display:flex;align-items:flex-start;gap:14px;margin:0 auto 30px;max-width:850px;font-size:14px}.message-avatar{padding-top:3px;flex-shrink:0}.message-body{min-width:0;flex:1}.message.user{flex-direction:row-reverse}.message.user .message-body{flex:0 1 auto;max-width:82%;background:var(--side);border-radius:15px;padding:14px 18px;line-height:1.7}.answer{display:none;line-height:1.8;color:var(--ink);margin-left:44px}.composer{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:22px;color:var(--muted);height:125px;box-shadow:0 8px 25px #00000004}.tools{display:flex;align-items:center;gap:24px;font-size:12px;margin-top:36px}.tools b{color:var(--ink);font-weight:400}.hint{font-size:11px;text-align:center;color:var(--muted);margin-top:12px}.toolbar{display:flex;align-items:center;justify-content:center;gap:12px;height:86px;border-top:1px solid var(--line);flex-wrap:wrap}.toolbar button{padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.toolbar button:hover{border-color:var(--muted)}.toolbar small{color:var(--muted)}/* Fish mark, StateDot and TextShimmer adapted from DeepSeek Harness 0.2.0-rc.2.

.chat-loading {
  padding-block: 8px 16px;
}
.chat-loading .chat-loading-avatar {
  color: #4d6bfe;
  padding-top: 2px;
}
.chat-loading-body {
  display: flex;
  flex-direction: column;
  gap: 9px;
  min-width: 0;
}
.chat-loading-model {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.chat-loading-status {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 14px;
  line-height: 24px;
}
.chat-loading-elapsed {
  margin-left: 5px;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.dsh-loading-spinner {
  flex: none;
}
.dsh-loading-spinner-motion {
  transform-origin: center;
  animation: dsh-loading-spin 1.5s linear infinite;
}
.dsh-loading-spinner-track,
.dsh-loading-spinner-arc {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
}
.dsh-loading-spinner-track {
  opacity: 0.25;
}
.dsh-loading-spinner-arc {
  stroke-dasharray: 12 150;
  animation: dsh-loading-dash 1.5s ease-in-out infinite;
}
.dsh-loading-text {
  position: relative;
  display: inline-grid;
  width: max-content;
  max-width: 100%;
  min-width: 0;
}
.dsh-loading-decoration {
  position: absolute;
  inset: 0;
  overflow: clip;
  pointer-events: none;
  user-select: none;
}
.dsh-loading-sweep {
  position: absolute;
  inset: 0;
  overflow: hidden;
  color: var(--ink);
  mask-image: linear-gradient(
    105deg,
    transparent 0%,
    black 40% 60%,
    transparent 100%
  );
  transform: translateX(-100%);
  animation-name: dsh-loading-sweep;
}
.dsh-loading-highlight {
  display: block;
  width: 100%;
  height: 100%;
  transform: translateX(100%);
  animation-name: dsh-loading-highlight;
  white-space: nowrap;
}
.dsh-loading-sweep,
.dsh-loading-highlight {
  animation-duration: 1.5s;
  animation-delay: 0.3s;
  animation-timing-function: steps(48, end);
  animation-iteration-count: infinite;
}
@keyframes dsh-loading-spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes dsh-loading-dash {
  0%,
  100% {
    stroke-dasharray: 12 150;
    stroke-dashoffset: 0;
  }
  50% {
    stroke-dasharray: 24 150;
    stroke-dashoffset: -6;
  }
}
@keyframes dsh-loading-sweep {
  0% {
    transform: translateX(-100%);
  }
  66.6667%,
  100% {
    transform: translateX(100%);
  }
}
@keyframes dsh-loading-highlight {
  0% {
    transform: translateX(100%);
  }
  66.6667%,
  100% {
    transform: translateX(-100%);
  }
}
:root[data-theme="dark"] .chat-loading .chat-loading-avatar {
  color: #8096ff;
}
@media (prefers-reduced-motion: reduce) {
  .dsh-loading-decoration {
    display: none;
  }
  .dsh-loading-spinner-motion,
  .dsh-loading-spinner-arc,
  .dsh-loading-sweep,
  .dsh-loading-highlight {
    animation: none;
  }
  .dsh-loading-spinner-arc {
    stroke-dasharray: 18 150;
    stroke-dashoffset: -3;
  }
}
