name: Open-source safety checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks CLI
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete reachable Git history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all --full-history" --redact=100 --no-banner'
      - name: Reject tracked company data and signing credentials
        run: |
          python3 - <<'PY'
          import subprocess,re,sys
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          forbidden=re.compile(r'(^|/)(?:\.data|\.cache|profiles|private-skills|company-data|secrets)(/|$)|(^|/)\.env(?!\.example$)(?:\.|$)|\.(?:sqlite(?:-wal|-shm)?|db|pfx|p12|pem|key)$',re.I)
          bad=[p for p in paths if p and forbidden.search(p)]
          if bad: print('Remove private paths from Git:',bad);sys.exit(1)
          print('No tracked company data or credential paths.')
          PY
