name: Desktop release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to build and publish (vX.Y.Z)
        required: true
        type: string
      reuse_run_id:
        description: Optional completed run with all four builds passed, for upload recovery
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  desktop:
    if: ${{ !inputs.reuse_run_id }}
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            arch: x64
            runner: windows-2025
          - platform: macOS
            arch: arm64
            runner: macos-15
          - platform: macOS
            arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Validate version and tagged source
        shell: bash
        run: |
          npm run version:check -- "$RELEASE_TAG"
          node -e 'if (process.arch !== process.env.TARGET_ARCH) process.exit(1)'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - name: Build Windows installer
        if: matrix.platform == 'Windows'
        run: node scripts/package-desktop.mjs --win nsis --x64 --publish never
      - name: Verify Windows installer
        if: matrix.platform == 'Windows'
        run: node scripts/verify-windows-package.mjs
      - name: Build macOS installer
        if: matrix.platform == 'macOS'
        run: node scripts/package-desktop.mjs --mac dmg --${{ matrix.arch }} --publish never
      - name: Verify mounted macOS package and first launch
        if: matrix.platform == 'macOS'
        run: node scripts/verify-macos-package.mjs
      - name: Save verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/SHA256SUMS-*.txt
            release/*-verification*.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Save desktop diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/desktop-verification.json
            artifacts/ui-fonts.json
            artifacts/screenshots/
            release/macos-first-launch-*.png
          retention-days: 14

  server:
    if: ${{ !inputs.reuse_run_id }}
    name: Company server update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Validate tagged version
        shell: bash
        run: npm run version:check -- "$RELEASE_TAG"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package prebuilt server UI and runtime source
        run: node scripts/package-server.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-server
          path: |
            release/Corporate-Brain-Server-*.zip
            release/SHA256SUMS-Server.txt
            release/server-verification.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish complete version to Releases
    needs: [desktop, server]
    if: ${{ always() && !cancelled() && (inputs.reuse_run_id != '' || (needs.desktop.result == 'success' && needs.server.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Validate original builds when recovering an upload
        run: node scripts/validate-release-build.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Check all hashes, upload to draft, verify uploads and publish
        run: node scripts/publish-release.mjs
