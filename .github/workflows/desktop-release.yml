name: Desktop release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to build and publish (vX.Y.Z)
        required: true
        type: string
      reuse_run_id:
        description: Optional completed run with all four builds passed, for upload recovery
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --draft --title "$RELEASE_TAG 公司大脑 · Windows / macOS 测试版" --notes-file "docs/releases/${RELEASE_TAG}.md"
          fi

  desktop:
    needs: prepare
    if: ${{ !inputs.reuse_run_id }}
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            arch: x64
            runner: windows-2025
          - platform: macOS
            arch: arm64
            runner: macos-15
          - platform: macOS
            arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      BRAIN_APP_URL: ${{ vars.BRAIN_APP_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Validate version and tagged source
        shell: bash
        run: |
          npm run version:check -- "$RELEASE_TAG"
          node -e 'if (process.arch !== process.env.TARGET_ARCH) process.exit(1)'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - name: Build Windows installer
        if: matrix.platform == 'Windows'
        run: node scripts/package-desktop.mjs --win nsis --x64 --publish never
      - name: Fetch prior Windows release for real upgrade verification
        if: matrix.platform == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.9.0 --repo "$env:GITHUB_REPOSITORY" --pattern Corporate-Brain-Setup-0.9.0-x64.exe --dir "$env:RUNNER_TEMP/brain-previous"
      - name: Verify native installer lifecycle and preserved local records
        if: matrix.platform == 'Windows'
        run: pwsh -NoProfile -File scripts/verify-installer.ps1 -FullLifecycle -PreviousInstaller "$env:RUNNER_TEMP/brain-previous/Corporate-Brain-Setup-0.9.0-x64.exe"
      - name: Verify Windows installer
        if: matrix.platform == 'Windows'
        run: node scripts/verify-windows-package.mjs
      - name: Build macOS installer
        if: matrix.platform == 'macOS'
        run: node scripts/package-desktop.mjs --mac dmg --${{ matrix.arch }} --publish never
      - name: Verify mounted macOS package and first launch
        if: matrix.platform == 'macOS'
        run: node scripts/verify-macos-package.mjs
      - name: Save verified Windows release assets
        if: matrix.platform == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber \
            release/*.exe release/SHA256SUMS-Windows-x64.txt release/windows-verification-x64.json
      - name: Save verified macOS release assets
        if: matrix.platform == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber \
            release/*.dmg "release/SHA256SUMS-macOS-${{ matrix.arch }}.txt" "release/macos-verification-${{ matrix.arch }}.json"

  server:
    needs: prepare
    if: ${{ !inputs.reuse_run_id }}
    name: Company server update
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Validate tagged version
        shell: bash
        run: npm run version:check -- "$RELEASE_TAG"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package prebuilt server UI and runtime source
        run: node scripts/package-server.mjs
      - name: Upload verified server assets directly to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber \
            release/Corporate-Brain-Server-*.zip release/SHA256SUMS-Server.txt release/server-verification.json

  publish:
    name: Publish complete version to Releases
    needs: [prepare, desktop, server]
    if: ${{ always() && !cancelled() && (inputs.reuse_run_id != '' || (needs.desktop.result == 'success' && needs.server.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Validate original builds when recovering an upload
        run: node scripts/validate-release-build.mjs
      - name: Download verified assets from draft release
        run: gh release download "$RELEASE_TAG" --dir release-assets --repo "$GH_REPO"
      - name: Check all hashes, upload to draft, verify uploads and publish
        run: node scripts/publish-release.mjs

  distribute:
    name: Verify company update distribution
    needs: publish
    if: ${{ vars.BRAIN_UPDATE_MIRROR == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: company-update-mirror
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Copy published installers, verify hashes and atomically activate mirror
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRAIN_UPDATE_HOST: ${{ vars.BRAIN_UPDATE_HOST }}
          BRAIN_UPDATE_USER: ${{ vars.BRAIN_UPDATE_USER }}
          BRAIN_UPDATE_SSH_KEY: ${{ secrets.BRAIN_UPDATE_SSH_KEY }}
          BRAIN_UPDATE_KNOWN_HOSTS: ${{ secrets.BRAIN_UPDATE_KNOWN_HOSTS }}
        run: node scripts/sync-update-mirror.mjs
