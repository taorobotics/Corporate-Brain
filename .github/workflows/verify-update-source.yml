name: Verify published update download

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published version to verify (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Confirm the tested runtime matches the published tag
        run: git diff --exit-code "$RELEASE_TAG" -- server shared desktop/updates.cjs package.json
      - run: npm ci --ignore-scripts
      - name: Download and verify the actual private release through the company service
        run: node --import tsx scripts/verify-update-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-source-verification
          path: artifacts/update-source-verification.json
          if-no-files-found: error
          retention-days: 30
