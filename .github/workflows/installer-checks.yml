name: Windows installer lifecycle
on:
  push:
    branches: [main]
    paths: ['build/windows/**', 'scripts/*installer*', 'scripts/update-resource-checks.ps1', 'scripts/verify-update-handoff.ps1', 'scripts/package-desktop.mjs', 'package.json', '.github/workflows/installer-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      # Exercise a configured client, including offline startup, without relying
      # on a production service. The disposable package is never distributed.
      BRAIN_APP_URL: http://127.0.0.1:4173
      BRAIN_VERIFY_VERBOSE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - run: node scripts/package-desktop.mjs --win nsis --x64 --publish never
      - name: Fetch pinned prior release for a real upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.9.0 --repo "$env:GITHUB_REPOSITORY" --pattern Corporate-Brain-Setup-0.9.0-x64.exe --dir "$env:RUNNER_TEMP/brain-previous"
      - name: Verify isolated native updater handoff
        run: pwsh -NoProfile -File scripts/verify-update-handoff.ps1
      - name: Install, cancel, upgrade, launch and uninstall on the disposable runner
        run: pwsh -NoProfile -File scripts/verify-installer.ps1 -FullLifecycle -PreviousInstaller "$env:RUNNER_TEMP/brain-previous/Corporate-Brain-Setup-0.9.0-x64.exe"
      - run: node scripts/verify-windows-package.mjs
      - name: Save real native diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-installer-diagnostics
          path: |
            artifacts/desktop-verification.json
            artifacts/screenshots/desktop-failure.png
            artifacts/installer-verification.json
            artifacts/installer-timeout.json
            artifacts/screenshots/installer-*.png
            release/windows-verification-x64.json
          retention-days: 14
